<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- Ajusta el path de tus estilos -->
    <script src="assets/js/script.js" defer></script>
    <!-- Ajusta el path de tus scripts -->
    <title>Navbar y Header</title>
  </head>
  <body>
    <div class="loader-bg">
      <div class="loader-track">
        <div class="loader-fill"></div>
      </div>
    </div>

    <nav class="pcoded-navbar">
      <div class="navbar-wrapper">
        <div class="navbar-content scroll-div">
          <ul class="nav pcoded-inner-navbar">
            <li class="nav-item pcoded-menu-caption">
              <label>Navegación</label>
            </li>
            <li class="nav-item">
              <a href="index.html" class="nav-link">
                <span class="pcoded-micon"
                  ><i class="feather icon-home"></i
                ></span>
                <span class="pcoded-mtext">Dashboard</span>
              </a>
            </li>
            <!-- Agrega más elementos de navegación aquí -->
          </ul>
        </div>
      </div>
    </nav>

    <header
      class="navbar pcoded-header navbar-expand-lg navbar-light header-dark"
    >
      <div class="m-header">
        <a class="mobile-menu" id="mobile-collapse" href="#!"><span></span></a>
        <a href="#!" class="b-brand">
          <img
            src="assets/img/santander.png"
            alt="Logo"
            class="logo"
            width="60px"
          />
          <img
            src="assets/img/santander.png"
            alt="Logo thumb"
            class="logo-thumb"
            width="60px"
          />
        </a>
        <a href="#!" class="mob-toggler"
          ><i class="feather icon-more-vertical"></i
        ></a>
      </div>
      <!-- Agrega más elementos del header aquí -->
    </header>
  </body>
</html>
